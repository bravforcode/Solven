services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=solven
      - POSTGRES_PASSWORD=solven
      - POSTGRES_DB=solven
    ports:
      - "5432:5432"
    volumes:
      - solven-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solven -d solven"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SOLVEN_API_TOKEN=${SOLVEN_API_TOKEN:?SOLVEN_API_TOKEN is required}
      - SOLVEN_ENV=${SOLVEN_ENV:-dev}
      - SOLVEN_DATABASE_URL=postgresql://solven:solven@db:5432/solven
      - SOLVEN_CORS_ORIGINS=http://localhost:3000
      - SOLVEN_LLM=mock
    ports:
      - "8000:8000"
    healthcheck:
      # readiness, not liveness: proves the persisted DB path actually works
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # server-only runtime URL (service DNS inside compose network) — fixes
      # the BFF-to-backend localhost bug (AUD-H-03 / DEV-01)
      - SOLVEN_BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_SOLVEN_API_URL=http://localhost:8000
      - SOLVEN_API_TOKEN=${SOLVEN_API_TOKEN:?SOLVEN_API_TOKEN is required}
    ports:
      - "3000:3000"

volumes:
  solven-db:
