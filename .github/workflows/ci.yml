name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: solven
          POSTGRES_PASSWORD: solven
          POSTGRES_DB: solven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solven -d solven_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          SOLVEN_LLM: mock
          SOLVEN_TEST_DATABASE_URL: postgresql://solven:solven@localhost:5432/solven_test
        run: python -m pytest tests -q

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # valid-format dummy keys (base64url payload) — Clerk's key parser
          # decodes the payload, so "dummy" (5 chars) would crash the build
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_c29sdmVuLWR1bW15LWtleQ"
          CLERK_SECRET_KEY: "sk_test_c29sdmVuLWR1bW15LWtleQ"
